<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSON 编辑器</title>
    <link rel="stylesheet" href="tool.css" />
    <style>
      #output {
        font-family: Consolas, monospace;
      }
      .key {
        color: var(--accent);
      }
      .string {
        color: #389d71;
      }
      .tree-children {
        margin-left: 18px;
      }
      summary small {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <strong>JSON 编辑器</strong
        ><button id="format" class="primary">格式化</button
        ><button id="minify">压缩复制</button
        ><button id="escape">转义复制</button><button id="xml">转 XML</button
        ><button id="types">转 TypeScript</button><span class="spacer"></span
        ><button id="sample">示例</button><button id="clear">清空</button
        ><button id="theme">◐</button>
      </div>
      <div class="split">
        <textarea
          id="source"
          class="editor"
          placeholder="粘贴 JSON、URL Params、XML 或 YAML…"
          spellcheck="false"
          aria-label="JSON 输入"
        ></textarea>
        <section style="display: flex; flex-direction: column">
          <div class="toolbar">
            <button id="tree">树视图</button><button id="text">文本</button
            ><button id="collapse">折叠</button><button id="expand">展开</button
            ><span class="spacer"></span><button id="copy">复制结果</button>
          </div>
          <div class="content" id="output"></div>
        </section>
      </div>
      <div class="toolbar">
        <label
          >过滤
          <input
            id="filter"
            placeholder="$.users.*.name"
            style="width: 240px" /></label
        ><button id="apply">应用</button
        ><span class="muted">路径过滤支持 .、[索引]、*；不执行 JavaScript</span>
      </div>
      <footer id="status" class="status" role="status"></footer>
    </main>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
